name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-node:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.13.x, 24.x, 26.x]
        os: [ubuntu-latest]
        include:
          - os: windows-latest
            node-version: 24.x

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        run: npm run test

# Uncomment to add Codecov support / setup Codecov / add coverage badge to README
#      - name: Upload coverage to Codecov
#        uses: codecov/codecov-action@v3
#        with:
#          token: ${{ secrets.CODECOV_TOKEN }}
#          flags: unittests

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js 24.x
        uses: actions/setup-node@v3
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm install

      - name: Check types
        run: npm run tsc
